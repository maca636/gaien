name: update-jingu

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-jingu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build jingu.json from official schedule
        run: python3 scripts/jingu_build.py
      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- jingu.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jingu.json
          git commit -m "jingu.json 更新"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
