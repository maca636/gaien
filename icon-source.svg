    <path d="M 164 58 Q 128 95 164 198" fill="none" stroke="#5AD1C2" stroke-width="1.5"/>
  </g>

  <!-- TR: eighth notes -->
  <g fill="#FF6F6F">
    <ellipse cx="330" cy="182" rx="24" ry="18" transform="rotate(-18 330 182)"/>
    <ellipse cx="404" cy="168" rx="24" ry="18" transform="rotate(-18 404 168)"/>
