    <line x1="128" y1="350" x2="128" y2="418" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="108" y1="358" x2="108" y2="376" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="128" y1="358" x2="128" y2="376" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="148" y1="358" x2="148" y2="376" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="108" y1="392" x2="108" y2="410" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="128" y1="392" x2="128" y2="410" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="148" y1="392" x2="148" y2="410" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- BR: hall / shrine building -->
  <g fill="#F0904A">
    <path d="M 320 356 Q 384 320 448 356 Q 420 344 384 344 Q 348 344 320 356 Z"/>
    <path d="M 332 350 L 436 350 L 452 372 L 316 372 Z"/>
    <rect x="336" y="372" width="96" height="70" />
    <rect x="343" y="378" width="10" height="58" fill="#FFFFFF"/>
    <rect x="365" y="378" width="10" height="58" fill="#FFFFFF"/>
    <rect x="387" y="378" width="10" height="58" fill="#FFFFFF"/>
    <rect x="409" y="378" width="10" height="58" fill="#FFFFFF"/>
    <rect x="316" y="442" width="136" height="14" rx="3" fill="#FFFFFF"/>
