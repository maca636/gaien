  <rect x="256" y="0"   width="256" height="256" fill="#FFD3D8"/>
  <rect x="0"   y="256" width="256" height="256" fill="#DFF5C6"/>
  <rect x="256" y="256" width="256" height="256" fill="#FFD9A6"/>

  <!-- TL: baseball -->
  <g>
    <circle cx="128" cy="128" r="82" fill="#FFFFFF" stroke="#5AD1C2" stroke-width="6"/>
    <path d="M 92 58 Q 128 95 92 198" fill="none" stroke="#5AD1C2" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
    <path d="M 164 58 Q 128 95 164 198" fill="none" stroke="#5AD1C2" stroke-width="4" stroke-dasharray="1 9" stroke-linecap="round"/>
